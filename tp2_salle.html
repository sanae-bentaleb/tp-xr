<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP2 - Salle XR interactive</title>
  <!-- Version figée : on note toujours la version utilisée (reproductibilité) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-v1.7.1.min.js"></script>
  <style>
    #hud {
      position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 10;
      pointer-events: none;
      font: 600 16px system-ui, sans-serif;
      color: #fff;
      text-shadow: 0 0 4px #000, 0 0 4px #000;
    }
  </style>
</head>
<body>
  <div id="hud">Visez avec le point blanc, touchez l'écran pour agir.</div>

  <a-scene id="scene" vr-mode-ui="enabled: false" renderer="antialias: true">

    <!-- ============ BLOC 1 : ENVIRONNEMENT (organisé par fonction) ============ -->
    <a-entity id="Environnement">
      <a-sky color="#9ec9ee"></a-sky>
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>

      <!-- Sol (6 m x 6 m). Touchez-le pour vous téléporter. -->
      <a-plane id="Sol" class="interactif" teleport-sol rotation="-90 0 0"
               width="6" height="6" material="color: #c9c9c9; roughness: 0.9"></a-plane>

      <!-- Murs (hauteur 3 m) -->
      <a-plane position="0 1.5 -3" width="6" height="3" material="color: #e8eef5"></a-plane>
      <a-plane position="-3 1.5 0" rotation="0 90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
      <a-plane position="3 1.5 0" rotation="0 -90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
      <a-plane position="0 1.5 3" rotation="0 180 0" width="6" height="3" material="color: #e8eef5"></a-plane>

      <!-- Table A : instruments (plateau à 0,75 m du sol) -->
      <a-entity id="Table_A" position="-0.6 0 -1">
        <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6" material="color: #8d6e63; roughness: 0.8"></a-box>
        <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
        <a-box position="0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
        <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
        <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      </a-entity>

      <!-- Table B : plateau avec 3 zones de dépôt -->
      <a-entity id="Table_B" position="0.6 0 -1">
        <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6" material="color: #eceff1; roughness: 0.5"></a-box>
        <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
        <a-box position="0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
        <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
        <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      </a-entity>

      <!-- Panneau de mission ancré dans le monde (pas collé à la tête) -->
      <a-plane position="0 2.0 -2.95" width="2.4" height="1.1" material="color: #1b2a41; shader: flat"></a-plane>
      <a-text id="Panneau" position="0 2.1 -2.93" width="2.2" align="center" color="#ffffff"
              value="Salle de formation&#10;Placez chaque instrument&#10;dans sa zone."></a-text>
      <a-text position="0 1.7 -2.93" width="2.2" wrap-count="50" align="center" color="#ffd54f"
              value="Prototype pédagogique - pas un dispositif médical"></a-text>
    </a-entity>
    <!-- FIN du groupe Environnement -->

    <!-- ============ BLOC 2 : ZONES DE DÉPÔT ============ -->
    <a-entity id="Zones">
      <a-cylinder id="zone_bistouri" class="interactif" zone-depot
                  position="0.3 0.755 -1" radius="0.1" height="0.01" color="#ef9a9a"></a-cylinder>
      <a-cylinder id="zone_pince" class="interactif" zone-depot
                  position="0.6 0.755 -1" radius="0.1" height="0.01" color="#90caf9"></a-cylinder>
      <a-cylinder id="zone_ecarteur" class="interactif" zone-depot
                  position="0.9 0.755 -1" radius="0.1" height="0.01" color="#a5d6a7"></a-cylinder>

      <a-text position="0.3 0.9 -1" width="0.7" align="center" color="#1b2a41" value="Bistouri"></a-text>
      <a-text position="0.6 0.9 -1" width="0.7" align="center" color="#1b2a41" value="Pince"></a-text>
      <a-text position="0.9 0.9 -1" width="0.7" align="center" color="#1b2a41" value="Écarteur"></a-text>
    </a-entity>

    <!-- ============ BLOC 3 : OBJETS INTERACTIFS (instruments) ============ -->
    <!-- Tailles >= 8 cm : visables facilement à ~2 m (voir TP3) -->
    <a-entity id="Instruments">
      <a-box id="bistouri" class="interactif" instrument="nom: Bistouri; zone: zone_bistouri"
             position="-0.9 0.79 -1" width="0.22" height="0.08" depth="0.08"
             material="color: #e53935; metalness: 0.3; roughness: 0.4"></a-box>

      <a-cylinder id="pince" class="interactif" instrument="nom: Pince; zone: zone_pince"
                  position="-0.6 0.80 -1" rotation="0 0 90" radius="0.05" height="0.2"
                  material="color: #1e88e5; metalness: 0.3; roughness: 0.4"></a-cylinder>

      <a-cone id="ecarteur" class="interactif" instrument="nom: Écarteur; zone: zone_ecarteur"
              position="-0.3 0.825 -1" radius-bottom="0.07" radius-top="0" height="0.15"
              material="color: #43a047; metalness: 0.3; roughness: 0.4"></a-cone>
    </a-entity>

    <!-- ============ BLOC 4 : XR ORIGIN (rig) + caméra + curseur ============ -->
    <!-- On déplace le RIG, jamais la caméra seule. wasd : test sur ordinateur. -->
    <a-entity id="rig" position="0 0 0.8" wasd-controls="acceleration: 15">
      <a-entity id="tete" camera position="0 1.6 0" look-controls>
        <a-entity id="curseur" cursor="fuse: false" raycaster="objects: .interactif; far: 8"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
                  material="color: #ffffff; shader: flat; opacity: 0.9"></a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

<script>
const THREE = AFRAME.THREE;

/* ---------- Petits outils : son et vibration ---------- */
let ctxAudio = null;
function bip(freq = 660, duree = 0.12) {
  try {
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(); o.stop(ctxAudio.currentTime + duree);
  } catch (e) { /* pas de son : on continue */ }
}
function vibrer(motif) { if (navigator.vibrate) navigator.vibrate(motif); } // Android seulement

/* ---------- État global du jeu (la "règle métier") ---------- */
const jeu = { main: null, score: 0, erreurs: 0, t0: null, fini: false };
const hud = document.getElementById('hud');

function majPanneau(msg) {
  document.getElementById('Panneau').setAttribute('text', 'value',
    'Score : ' + jeu.score + ' / 3   |   Erreurs : ' + jeu.erreurs + '\n' + msg);
  hud.textContent = (jeu.main
      ? 'En main : ' + jeu.main.components.instrument.data.nom + ' - touchez sa zone'
      : 'Touchez un instrument pour le saisir')
    + ' | Score ' + jeu.score + '/3 Erreurs ' + jeu.erreurs;
}

/* ---------- Composant : téléportation en touchant le sol ---------- */
AFRAME.registerComponent('teleport-sol', {
  init() {
    this.el.addEventListener('click', e => {
      if (!e.detail.intersection) return;
      const p = e.detail.intersection.point;
      const rig = document.getElementById('rig');
      const x = Math.max(-2.4, Math.min(2.4, p.x));
      const z = Math.max(-2.4, Math.min(2.4, p.z));
      rig.object3D.position.set(x, 0, z);   // on déplace le RIG
      bip(440, 0.08);
    });
  }
});

/* ---------- Composant : instrument (machine à états) ---------- */
/* états : libre -> survole -> saisi -> (libre | depose) */
AFRAME.registerComponent('instrument', {
  schema: { nom: { type: 'string' }, zone: { type: 'string' } },
  init() {
    this.etat = 'libre';
    this.posInit = null;   // mémorisées au premier saisir()
    this.rotInit = null;
    this.el.addEventListener('mouseenter', () => { if (this.etat === 'libre') this.setEtat('survole'); });
    this.el.addEventListener('mouseleave', () => { if (this.etat === 'survole') this.setEtat('libre'); });
    this.el.addEventListener('click', () => {
      if (this.etat === 'depose') return;
      if (this.etat === 'saisi') this.relacher();   // retoucher = annuler
      else if (!jeu.main) this.saisir();            // une seule main
    });
  },
  setEtat(e) {
    this.etat = e;
    // Retour visuel : surbrillance quand l'objet est visé
    this.el.setAttribute('material', 'emissive', e === 'survole' ? '#ffee58' : '#000000');
    this.el.setAttribute('material', 'emissiveIntensity', e === 'survole' ? 0.6 : 0);
  },
  saisir() {
    if (!jeu.t0) jeu.t0 = performance.now();
    if (!this.posInit) {
      this.posInit = this.el.object3D.position.clone();
      this.rotInit = this.el.object3D.rotation.clone();
    }
    const tete = document.getElementById('tete');
    tete.object3D.attach(this.el.object3D);          // l'objet devient enfant de la tête
    this.el.object3D.position.set(0.22, -0.22, -0.7); // en bas à droite : ne masque pas le curseur
    this.el.object3D.rotation.set(0, 0, 0);
    this.el.classList.remove('interactif');          // le rayon ignore l'objet tenu
    jeu.main = this.el;
    this.setEtat('saisi');
    bip(520); vibrer(30);
    majPanneau('Vous tenez : ' + this.data.nom);
  },
  relacher() {   // retour à la place initiale
    document.getElementById('scene').object3D.attach(this.el.object3D);
    this.el.object3D.position.copy(this.posInit);
    this.el.object3D.rotation.copy(this.rotInit);
    this.el.classList.add('interactif');
    jeu.main = null;
    this.setEtat('libre');
    bip(330, 0.1);
    majPanneau('Instrument reposé.');
  },
  deposer(zoneEl) {
    const p = new THREE.Vector3();
    zoneEl.object3D.getWorldPosition(p);
    const obj = this.el.object3D;
    document.getElementById('scene').object3D.attach(obj);
    obj.rotation.set(0, 0, 0);
    obj.position.set(p.x, p.y, p.z);
    // On pose l'objet exactement sur le disque (dessus du disque = p.y + 0,005)
    obj.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(obj);
    obj.position.y += (p.y + 0.005) - box.min.y;
    jeu.main = null;
    this.setEtat('depose');
  }
});

/* ---------- Composant : zone de dépôt (règle métier + confirmation) ---------- */
AFRAME.registerComponent('zone-depot', {
  init() {
    this.el.addEventListener('click', () => {
      if (!jeu.main || jeu.fini) return;
      const inst = jeu.main.components.instrument;
      if (inst.data.zone === this.el.id) {            // bonne zone
        inst.deposer(this.el);
        jeu.score++;
        bip(880, 0.2); vibrer([40, 60, 40]);
        this.el.setAttribute('material', 'color', '#2e7d32');
        if (jeu.score === 3) {
          jeu.fini = true;
          const s = ((performance.now() - jeu.t0) / 1000).toFixed(0);
          majPanneau('TERMINÉ en ' + s + ' s');
          console.log('RESULTAT', JSON.stringify({ secondes: +s, erreurs: jeu.erreurs }));
        } else majPanneau('Bien joué !');
      } else {                                        // mauvaise zone : erreur récupérable
        jeu.erreurs++;
        bip(180, 0.3); vibrer([100, 50, 100]);
        const ancienne = this.el.getAttribute('material').color;
        this.el.setAttribute('material', 'color', '#d32f2f');
        setTimeout(() => this.el.setAttribute('material', 'color', ancienne), 500);
        inst.relacher();
        majPanneau('Mauvaise zone. Réessayez.');
      }
    });
  }
});

/* ---------- Outils de mesure (étape Performance) ---------- */
// ?stats affiche FPS / triangles / draw calls ; ?stress=200 ajoute 200 sphères coûteuses.
const params = new URLSearchParams(location.search);
const sceneEl = document.getElementById('scene');
if (params.has('stats')) sceneEl.setAttribute('stats', '');
const nbStress = parseInt(params.get('stress') || '0', 10);

  s.setAttribute('radius', 0.08);
  s.setAttribute('segments-width', 32);
  s.setAttribute('segments-height', 32);
  s.setAttribute('position', {
    x: (Math.random() - 0.5)
</body>
</html>
